<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta
      name="description"
      content="《大数据分析实践》智慧课程平台：以项目状态为核心，AI 项目顾问根据上传材料与已提交证据，给出 1~3 步建议并说明为什么现在做，同时提供论文检索提示词。"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>《大数据分析实践》智慧课程平台 · AI 项目顾问</title>
  </head>
  <body>
    <!--
      界面契约
      ----------------------------------------------------------------
      THESIS：学生打开平台要立刻看清两件事——项目现在走到哪个里程碑、下一步该做什么。
      因此首屏是三栏工作台：左边是项目事实（材料 / 里程碑 / 活跃度 / 疑问），
      中间是 AI 顾问的步骤建议（每步都写清为什么现在做、完成标志是什么），右边是提交证据。
      OWN-WORLD：浅灰底 #f5f6f8 + 纯白卡片 + 12px 圆角 + 发丝线；语义色只用于状态
      （蓝=进行中 #185FA5/#378ADD、绿=已完成 #1D9E75、紫=AI #534AB7、琥珀=疑问 #FAC775）；
      不用渐变承担层次，层次只由底色差、发丝线与字号阶梯建立。
      STORY：项目不是靠填表推进的，是靠「认领一步 → 做完 → 提交证据 → 状态更新」推进的。
      所以每一步必须带完成标志，每一条证据都要落到里程碑上，未确定的事自动进入「未解决的疑问」。
      FIRST VIEWPORT：没有项目时是创建页（选题目、填人数、上传实验手册与数据集）；
      有项目时第一屏是一条五段里程碑流程条，其下三栏工作台。
      FINISH：界面与 platform-ui-mockup(3).html 保持一致；样式同源于 src/styles/platform.css。
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
