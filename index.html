<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04080f" />
    <meta
      name="description"
      content="《大数据分析实践》智慧课程平台：以课程资源为证据底座，支持学习路径组织、可溯源智能问答与细粒度能力诊断。"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>《大数据分析实践》智慧课程平台</title>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — 「深海读数」
      THESIS: 课程的证据链是这条界面唯一的主角：每一句回答、每一条建议都牵着一根可点击的出处线；拒绝"AI 聊天窗 + 同尺寸卡片网格"这一类别默认形态——平台的全部构图由"模块—讲次—资源—证据"这条链推导而来。
      OWN-WORLD: 深海蓝黑水体（#04080f → #0a1322）+ 半透明玻璃分栏，只以 1px 镜面发丝线宣告高度、从不使用投影；唯一强调色是青蓝读数光（#35e0f0 → #6d7bff），只允许"正在发生"的事物发光；拉丁与数字走 Sora 的几何字形，中文走系统黑体。
      STORY: 学生看到每个结论旁边都挂着出处，于是敢信；于是沿着"上一讲 / 下一讲"与"去复习"的路径继续走；最后在能力画像里看见自己薄弱的那一格，并知道下一步点哪里。
      FIRST VIEWPORT: 一条悬浮玻璃任务栏横贯顶部；其下左轨是"模块—讲次"的纵向刻度，右区是当前讲次按"课件 / 实验手册 / 项目规范 / 经验材料"聚合的资源行；背景只有三处极低饱和的青蓝光源。主行动"继续第 04 讲"就落在左轨第一个高亮刻度上，不需要寻找。
      FORM: 深色水体 + 玻璃分栏（Operate 模式下的 Committed 色彩策略）；用户已指定"科技青蓝 / 微光玻璃"，属 pin 定的世界，故不执行 concept-seed 摇号，直接按 pinned direction 全量落地。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
