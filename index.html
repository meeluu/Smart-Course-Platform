      content="《大数据分析实践》智慧课程平台：以课程资源为证据底座，支持学习路径组织、可溯源智能问答与细粒度能力诊断。"

  <body>
    <!--
      DIRECTION CONTRACT — 「纸上系统」
      THESIS: 界面唯一的主角是「项目当前状态」。它必须看起来像一张可以安静读下去的纸，而不是一块会发光的控制台；因此拒绝上一版的深海底色、彩色发光与渐变——层次改由底色差（浅灰页 / 纯白卡）、发丝线和字号阶梯建立。
      OWN-WORLD: iOS 原生观感：页面 #f2f2f7、卡片纯白、分隔线 rgba(60,60,67,.14)；唯一强调色是系统蓝 #007aff，只用于"可点 / 已选中 / 正在发生"；中性色四档（#1c1c1e / #3a3a3c / #55555a / #6e6e73）全部达到 5.2:1 以上；全站系统字体栈（-apple-system / SF Pro / 苹方）。
      STORY: 学生先看见自己的项目逻辑断在哪，再被追问一个答不上来就该自己复盘的问题；写下判断之后，状态才发生变化；于是系统用得越多，留下的是更多学生的判断与依据，而不是更少。
      FIRST VIEWPORT: 一条半透明材质的浅色任务栏横贯顶部，右侧常驻"待你处理 N 项"；其下第一屏是项目身份带与四个直接动作（我卡住了 / 检查跑偏 / 下一步做什么 / 准备问老师），紧接着是「此刻最需要你处理的事」——断裂点用系统红置顶，且没有任何"一键修复"。
      FORM: 浅色分组式界面（Operate 模式下的 Restrained 色彩策略：中性为主 + 单一强调色）；用户已指定"参考 iOS、简约流畅丝滑"，属 pin 定的世界，故不执行 concept-seed 摇号，直接按 pinned direction 全量落地。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
